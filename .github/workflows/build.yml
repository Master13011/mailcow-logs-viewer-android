name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: SIGNED
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build (release signé si secrets présents, sinon debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            gradle :app:lintRelease :app:assembleRelease
          else
            gradle :app:assembleDebug
          fi

      - name: Vérifier la signature, renommer l'APK et générer le SHA-256
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Vérification de : $APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_FILE"

          # Déterminer le nom de version (le tag Git ou "dev" par défaut)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          # Déterminer le type (release ou debug)
          if [[ "$APK_FILE" == *"release"* ]]; then
            TYPE="release"
          else
            TYPE="debug"
          fi

          # Créer le dossier de sortie propre
          mkdir -p dist
          FINAL_NAME="mailcow-logs-viewer-${VERSION}-${TYPE}.apk"
          cp "$APK_FILE" "dist/$FINAL_NAME"

          # Générer le fichier de contrôle SHA-256
          cd dist
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
          ls -lh

      - name: Uploader les artefacts
        uses: actions/upload-artifact@v7
        with:
          name: mailcow-logs-viewer-apk
          path: dist/*
          if-no-files-found: error

      - name: Publier l'APK et le SHA-256 dans une GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
