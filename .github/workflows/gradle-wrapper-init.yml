name: Initialiser le Gradle Wrapper

# À lancer UNE SEULE FOIS (Actions → Initialiser le Gradle Wrapper → Run workflow).
# Génère gradlew + gradle/wrapper/* afin que Dependabot puisse mettre Gradle à jour.
# Ensuite, Dependabot propose lui-même les nouvelles versions de Gradle.
on:
  push:
    branches:
      - refactor
  workflow_dispatch:
    inputs:
      gradle_version:
        description: "Version de Gradle (≥ minimum exigé par l'AGP du projet)"
        required: true
        default: "9.9.1"

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ inputs.gradle_version || '9.9.1' }}

      - name: Générer le wrapper
        env:
          GRADLE_VERSION: ${{ inputs.gradle_version || '9.9.1' }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin

      - name: Committer le wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "chore: add Gradle wrapper" || echo "Rien à committer"
          git push
